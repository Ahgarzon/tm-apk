name: TourMaps central Android pilot
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      source_commit:
        description: Optional exact integrated source SHA; rejects stale requests
        required: false
        type: string
      preflight_only:
        description: Prepare toolchains and test source without building or releasing
        required: false
        default: false
        type: boolean
  schedule:
    # Off-peak minutes reduce the documented scheduler congestion at :00.
    # The schedule is a polling interval, not a guaranteed execution deadline.
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: write
jobs:
  build:
    # Only two verified stable account IDs and a fixed issue/command. Comment
    # text is never interpolated into shell, arguments, refs or environment.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.action == 'created' && !github.event.issue.pull_request &&
       github.event.issue.number == 10 && github.event.comment.body == '/tourmaps-build' &&
       (github.event.comment.user.id == 114458437 || github.event.comment.user.id == 340242138) &&
       github.event.sender.id == github.event.comment.user.id)
    concurrency:
      group: tourmaps-android-pilot
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Get only this public builder, pinned to the dispatched workflow revision
        env:
          BUILDER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init --quiet .
          git remote add origin https://github.com/Ahgarzon/tm-apk.git
          git fetch --quiet --depth=1 origin "$BUILDER_SHA"
          git checkout --quiet --detach FETCH_HEAD
          python3 -m unittest discover -s builder -p 'test_*.py'
      - name: Build reviewed private source, verify existing pilot signature, publish candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TOURMAPS_SOURCE_SSH_KEY: ${{ secrets.TOURMAPS_SOURCE_SSH_KEY }}
          TOURMAPS_COORDINATION_SSH_KEY: ${{ secrets.TOURMAPS_COORDINATION_SSH_KEY }}
          TOURMAPS_FIREBASE_ANDROID_JSON: ${{ secrets.TOURMAPS_FIREBASE_ANDROID_JSON }}
          TOURMAPS_MAPS_ANDROID_KEY: ${{ secrets.TOURMAPS_MAPS_ANDROID_KEY }}
          TOURMAPS_PILOT_KEYSTORE_B64: ${{ secrets.TOURMAPS_PILOT_KEYSTORE_B64 }}
          TOURMAPS_ORIGINAL_SIGNING_JSON: ${{ secrets.TOURMAPS_ORIGINAL_SIGNING_JSON }}
          TOURMAPS_DIAGNOSTIC_SSH_KEY: ${{ secrets.TOURMAPS_DIAGNOSTIC_SSH_KEY }}
          REQUESTED_SOURCE: ${{ inputs.source_commit }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 builder/build.py
